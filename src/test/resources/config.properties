# ---------------------------------------------------------------------------
# MyWe HRMS - environment configuration
# Every key here can be overridden at runtime with -Dkey=value
# ---------------------------------------------------------------------------

# --- Application under test -------------------------------------------------
base.url=https://test.mywehr.com
login.path=/login
tenant.code=myc001

# --- Browser ----------------------------------------------------------------
browser=chrome
headless=false
window.maximize=true
browser.width=1920
browser.height=1080
grid.url=http://localhost:4444/wd/hub

# --- Waits (seconds) --------------------------------------------------------
# The app is a React SPA behind a "Loading Mywe HRMS..." splash, so page
# transitions need a slightly longer explicit wait than a server-rendered app.
implicit.wait=0
explicit.wait=25
page.load.timeout=60
script.timeout=30
spa.settle.wait=20
# Best-effort wait for MUI skeletons/spinners after a data fetch. Kept short on
# purpose: it is an optimisation, not a correctness gate, and some charts keep a
# shimmer element mounted indefinitely - paying the full explicit wait on every
# navigation would add minutes to the suite for no extra confidence.
data.settle.wait=8
polling.interval.millis=300

# --- Reporting --------------------------------------------------------------
report.dir=test-output/reports
screenshot.dir=test-output/screenshots
screenshot.on.failure=true
screenshot.on.success=false

# --- Execution --------------------------------------------------------------
retry.count=1
